name: 监测与发布
on:
  schedule:
    - cron: '23 1,13 * * *'
  workflow_dispatch:
    inputs:
      old_url:
        description: '可选：首次运行的旧 APK 官方地址'
        type: string
      new_url:
        description: '可选：指定历史新 APK，报告不设为 Latest'
        type: string
concurrency:
  group: wechatdiff-monitor
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      OLD_URL: ${{ inputs.old_url }}
      NEW_URL: ${{ inputs.new_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: 编译与安装 JADX
        run: |
          mkdir -p .work
          go build -o .work/wechatdiff ./cmd/wechatdiff
          bash scripts/install-jadx.sh
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: 恢复持久化状态
        run: python3 scripts/releases.py restore --dir .work/state
      - name: 下载、签名校验与差分分析
        id: analyze
        run: |
          args=(--out out --work .work/run --jadx "$PWD/.work/tools/jadx/bin/jadx" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --known-tags .work/state/known-tags.txt)
          if [[ -n "$NEW_URL" ]]; then
            args+=(--new-url "$NEW_URL")
            if [[ -n "$OLD_URL" ]]; then args+=(--old-url "$OLD_URL"); fi
          elif [[ -f .work/state/snapshot.json.gz ]]; then
            args+=(--baseline .work/state/snapshot.json.gz)
          elif [[ -n "$OLD_URL" ]]; then
            args+=(--old-url "$OLD_URL")
          fi
          .work/wechatdiff "${args[@]}"
      - name: 发布完整 Release
        if: steps.analyze.outputs.changed == 'true'
        run: |
          args=(--dir out)
          if [[ -n "$NEW_URL" ]]; then args+=(--historical); fi
          python3 scripts/releases.py publish "${args[@]}"
      - name: 保存诊断及报告（不含 APK 和完整源码）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-and-diagnostics
          path: |
            out/
            .work/run/**/*.log
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
